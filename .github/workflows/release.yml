name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: 校验 tag 与 package.json 版本一致
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          pkg_tag="v$(node -p "require('./package.json').version")"
          if [ "$pkg_tag" != "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME 与 package.json 版本 $pkg_tag 不一致"
            exit 1
          fi

      - name: 检查 NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::缺少仓库 Secret NPM_TOKEN"
            exit 1
          fi

      - name: 发布到 npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
