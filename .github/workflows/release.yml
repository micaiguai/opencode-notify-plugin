name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag（例如 v0.1.0）"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: 校验 tag 与 package.json 版本一致
        env:
          REF_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          pkg_tag="v$(node -p "require('./package.json').version")"
          if [ "$pkg_tag" != "$REF_NAME" ]; then
            echo "::error::tag $REF_NAME 与 package.json 版本 $pkg_tag 不一致"
            exit 1
          fi

      # 认证走 Trusted Publishing（OIDC），不使用 NPM_TOKEN。
      # 首次发布前需在 npmjs.com 或 `npm trust github` 注册本 workflow。
      - name: 检查该版本是否已发布
        id: check
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "opencode-notify-plugin@$version" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::opencode-notify-plugin@$version 已在 npm 上，跳过发布"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 npm
        if: steps.check.outputs.skip != 'true'
        timeout-minutes: 10
        run: npm publish --access public
